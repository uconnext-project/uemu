<html><body><h1>Pairing a Phone</h1><p>Enable Bluetooth on your phone. On Uconnect choose Phone &gt; Settings &gt; Paired Phones &gt; Add Device.</p><p>Select your phone in the list and confirm the pairing code on both devices.</p><p>Up to ten phones can be paired, but only one phone is connected at a time.</p></body></html>
